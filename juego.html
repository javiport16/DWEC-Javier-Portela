<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de misiones</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/juego.js" defer></script>
</head>
<body>
    <main>
        <h1>Juego de misiones</h1>

        <p id="saludo"></p>
        <!-- Panel del jugador: lo rellena JavaScript -->

        <section id="panel">
            <h2>Panel del jugador</h2>
            <p>Nombre: <span id="nombreFormateado"></span></p>
            <p>Edad: <span id="edad"></span> años</p>
        </section>

        <p>Misión: consigue <span id="objetivo"></span> puntos atacando al monstruo.</p>

        <p>Puntuación: <span id="puntuacion">0</span></p>
        <p>Ataques realizados: <span id="intentos">0</span></p>

        <button type="button" id="btnAtacar">Atacar</button>
        <button type="button" id="btnAyuda">Ayuda</button>

        <p id="resultado"></p>
        <p>Historial de ataques: <span id="historial">-</span></p>

        <button type="button" id="btnSalir">Salir</button>
    </main>
</body>
</html>
